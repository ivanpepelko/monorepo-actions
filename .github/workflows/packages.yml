name: Packages

on: workflow_dispatch

jobs:
  get-packages:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/simmcomm/packages

          gh api --jq '.[] | select(.repository.name == "frontend-apps") | .name' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            '/orgs/simmcomm/packages?package_type=container'
